<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REAPER 21 · Operador RPA</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="view"></canvas>
<canvas id="hud"></canvas>
<div id="gcs-frame" class="hidden"></div>

<!-- letterbox y rótulos de cinemática -->
<div id="bars"><i></i><i></i></div>
<div id="caption" class="hidden"><h2></h2><p></p></div>
<div id="skip" class="hidden">ESPACIO · saltar</div>

<!-- objetivo, radio y avisos de interacción -->
<div id="objective" class="hidden"><span class="dia"></span><div><small></small><b></b></div></div>
<div id="radio" class="hidden"><b></b><span></span></div>
<div id="prompt" class="hidden"><kbd>F</kbd><span></span></div>
<div id="toast" class="hidden"></div>

<!-- tarea entrante / informe / pausa -->
<div id="panel" class="hidden">
  <div class="sheet">
    <div class="tag"></div>
    <h2></h2>
    <div class="body"></div>
    <div class="actions"></div>
  </div>
</div>

<!-- menú principal -->
<div id="menu">
  <div class="shade"></div>
  <div class="col">
    <div class="brand"><span>REAPER</span> 21<small>OPERADOR RPA · BAGRAM</small></div>
    <nav id="nav"></nav>
    <div class="foot">ALFA 0.2 · Terreno y satélite reales · Modelos CC-BY (ver créditos)</div>
  </div>
  <div class="info" id="info"></div>
  <div class="loading" id="loading"><div class="bar"><i id="l-bar"></i></div><span id="l-txt">Cargando…</span></div>
</div>

<div id="fade"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
